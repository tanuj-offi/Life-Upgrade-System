<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Life Upgrade System</title>
<link rel="stylesheet" href="/static/style.css"/>
</head>
<body>

<!-- ===== AUTH SCREENS ===== -->
<div id="auth-screen" class="auth-screen hidden">
  <!-- Futuristic soft neon orbs background -->
  <div class="auth-bg-decorations" aria-hidden="true">
    <div class="auth-neon-orb orb-1"></div>
    <div class="auth-neon-orb orb-2"></div>
    <div class="auth-neon-orb orb-3"></div>
    <div class="auth-star-cluster">
      <div class="star star-1"></div>
      <div class="star star-2"></div>
      <div class="star star-3"></div>
      <div class="star star-4"></div>
      <div class="star star-5"></div>
      <div class="star star-6"></div>
      <div class="star-particle p-1"></div>
      <div class="star-particle p-2"></div>
    </div>
  </div>

  <div class="auth-card">
    <div class="auth-logo">
      <div class="brand-logo-wrap auth-logo-icon">
        <svg class="brand-logo-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="authBrandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#4ade80"/>
              <stop offset="50%" stop-color="#a3e635"/>
              <stop offset="100%" stop-color="#bef264"/>
            </linearGradient>
            <linearGradient id="authBrandGlow" x1="50%" y1="0%" x2="50%" y2="100%">
              <stop offset="0%" stop-color="#a3e635" stop-opacity="0.3"/>
              <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <path d="M18 3L30 8V18C30 25.5 24.8 30.8 18 33C11.2 30.8 6 25.5 6 18V8L18 3Z" fill="url(#authBrandGlow)" stroke="rgba(163,230,53,0.35)" stroke-width="1.3"/>
          <path d="M11 22C13.5 19 16 17.5 18 17.5C20 17.5 22.5 19 25 22" stroke="url(#authBrandGrad)" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M12 16L18 10L24 16" stroke="url(#authBrandGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M18 6L19.3 8.8L18 11.2L16.7 8.8Z" fill="#ffffff"/>
        </svg>
      </div>
      <div class="auth-brand-text">
        <h1>Life Upgrade</h1>
        <span class="auth-system-badge">SYSTEM</span>
      </div>
    </div>

    <!-- Official Brand Tagline -->
    <div class="auth-tagline-container">
      <span class="auth-tagline-pill">PERSONAL EVOLUTION PLATFORM</span>
      <h2 class="auth-tagline-title">Upgrade your habits.<br/><span class="lime-glow-text">Level up your life.</span></h2>
      <p class="auth-tagline-desc">Transform your daily tasks into XP, unlock 20 ranks of mastery, and conquer your goals.</p>
    </div>

    <!-- Tab buttons -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="showAuthTab('login')">Sign In</button>
      <button class="auth-tab" id="tab-register" onclick="showAuthTab('register')">Register</button>
    </div>

    <!-- Login form -->
    <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
      <div class="field-group">
        <label>Username</label>
        <input type="text" id="login-username" placeholder="Enter username" autocomplete="username" required/>
      </div>
      <div class="field-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Enter password" autocomplete="current-password" required/>
      </div>
      <div id="login-error" class="form-error hidden"></div>
      <button type="submit" class="btn-primary btn-full" id="login-btn">Sign In</button>
    </form>

    <!-- Register form -->
    <form id="register-form" class="auth-form hidden" onsubmit="handleRegister(event)">
      <div class="field-group">
        <label>Username</label>
        <input type="text" id="reg-username" placeholder="Choose a username (3–50 chars)" autocomplete="username" required/>
      </div>
      <div class="field-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="At least 6 characters" autocomplete="new-password" required/>
      </div>
      <div id="register-error" class="form-error hidden"></div>
      <button type="submit" class="btn-primary btn-full" id="register-btn">Create Account</button>
    </form>
  </div>
</div>

<!-- ===== MAIN APP ===== -->
<div id="app" class="app-layout hidden">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand-logo-wrap sidebar-logo-icon">
        <svg class="brand-logo-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="sideBrandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#4ade80"/>
              <stop offset="50%" stop-color="#a3e635"/>
              <stop offset="100%" stop-color="#bef264"/>
            </linearGradient>
            <linearGradient id="sideBrandGlow" x1="50%" y1="0%" x2="50%" y2="100%">
              <stop offset="0%" stop-color="#a3e635" stop-opacity="0.3"/>
              <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <path d="M18 3L30 8V18C30 25.5 24.8 30.8 18 33C11.2 30.8 6 25.5 6 18V8L18 3Z" fill="url(#sideBrandGlow)" stroke="rgba(163,230,53,0.35)" stroke-width="1.3"/>
          <path d="M11 22C13.5 19 16 17.5 18 17.5C20 17.5 22.5 19 25 22" stroke="url(#sideBrandGrad)" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M12 16L18 10L24 16" stroke="url(#sideBrandGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M18 6L19.3 8.8L18 11.2L16.7 8.8Z" fill="#ffffff"/>
        </svg>
      </div>
      <div class="sidebar-brand-group">
        <span class="sidebar-brand">Life Upgrade</span>
        <span class="sidebar-tag">SYSTEM</span>
      </div>
      <button class="sidebar-close" onclick="toggleSidebar()" aria-label="Close menu">✕</button>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-item" data-page="dashboard" onclick="navigate('dashboard')">
        <span class="nav-icon-wrap">
          <svg class="nav-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="6" height="6" rx="1.5"></rect>
            <rect x="11" y="3" width="6" height="4" rx="1.5"></rect>
            <rect x="11" y="9" width="6" height="8" rx="1.5"></rect>
            <rect x="3" y="11" width="6" height="6" rx="1.5"></rect>
          </svg>
        </span>
        <span class="nav-label">Dashboard</span>
      </a>
      <a class="nav-item" data-page="tasks" onclick="navigate('tasks')">
        <span class="nav-icon-wrap">
          <svg class="nav-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 10.2L9 12.2L13.5 7.8"></path>
            <circle cx="10" cy="10" r="7.5"></circle>
          </svg>
        </span>
        <span class="nav-label">My Tasks</span>
      </a>
      <a class="nav-item" data-page="schedule" onclick="navigate('schedule')">
        <span class="nav-icon-wrap">
          <svg class="nav-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 6V10L13 12"></path>
            <path d="M4 3.5H16"></path>
            <rect x="3" y="3" width="14" height="14" rx="3"></rect>
          </svg>
        </span>
        <span class="nav-label">Schedule</span>
      </a>
      <a class="nav-item" data-page="levels" onclick="navigate('levels')">
        <span class="nav-icon-wrap">
          <svg class="nav-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 4H14V9C14 11.2 12.2 13 10 13C7.8 13 6 11.2 6 9V4Z"></path>
            <path d="M6 6H3.5C2.7 6 2 6.7 2 7.5C2 8.9 3.1 10 4.5 10H6"></path>
            <path d="M14 6H16.5C17.3 6 18 6.7 18 7.5C18 8.9 16.9 10 15.5 10H14"></path>
            <path d="M10 13V16"></path>
            <path d="M7 16H13"></path>
          </svg>
        </span>
        <span class="nav-label">Achievements</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user" id="sidebar-user"></div>
      <button class="btn-logout" onclick="handleLogout()" title="Sign Out">
        <svg class="logout-svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 17H4C3.4 17 3 16.6 3 16V4C3 3.4 3.4 3 4 3H7"></path>
          <path d="M12 14L16 10L12 6"></path>
          <path d="M16 10H7"></path>
        </svg>
        <span>Sign Out</span>
      </button>
    </div>
  </aside>

  <!-- OVERLAY (mobile) -->
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <!-- Top bar (mobile) -->
    <header class="topbar">
      <button class="hamburger" onclick="toggleSidebar()" aria-label="Open menu">☰</button>
      <span class="topbar-title" id="topbar-title">Dashboard</span>
      <div class="topbar-player" id="topbar-player"></div>
    </header>

    <!-- Pages -->
    <div id="page-dashboard" class="page hidden"></div>
    <div id="page-tasks"     class="page hidden"></div>
    <div id="page-schedule"  class="page hidden"></div>
    <div id="page-levels"    class="page hidden"></div>
  </main>
</div>

<!-- ===== MODALS ===== -->

<!-- Task modal (create / edit) -->
<div id="task-modal" class="modal-backdrop hidden" onclick="closeTaskModalOnBackdrop(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 id="task-modal-title">New Task</h2>
      <button class="modal-close" onclick="closeTaskModal()">✕</button>
    </div>
    <form id="task-form" onsubmit="handleTaskSave(event)">
      <div class="field-group">
        <label>Task name *</label>
        <input type="text" id="task-name" placeholder="What needs to be done?" maxlength="255" required/>
      </div>
      <div class="field-group">
        <label>Difficulty &amp; XP</label>
        <div class="difficulty-row">
          <label class="diff-option">
            <input type="radio" name="task-xp" value="10" id="diff-easy" checked/>
            <span class="diff-badge easy"><span class="diff-dot easy"></span>Easy — 10 XP</span>
          </label>
          <label class="diff-option">
            <input type="radio" name="task-xp" value="25" id="diff-medium"/>
            <span class="diff-badge medium"><span class="diff-dot medium"></span>Medium — 25 XP</span>
          </label>
          <label class="diff-option">
            <input type="radio" name="task-xp" value="50" id="diff-hard"/>
            <span class="diff-badge hard"><span class="diff-dot hard"></span>Hard — 50 XP</span>
          </label>
        </div>
      </div>
      <div class="field-group">
        <label>Due date <span class="label-hint">(optional)</span></label>
        <input type="date" id="task-due"/>
      </div>
      <div id="task-form-error" class="form-error hidden"></div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" onclick="closeTaskModal()">Cancel</button>
        <button type="submit" class="btn-primary" id="task-save-btn">Save Task</button>
      </div>
    </form>
  </div>
</div>

<!-- Confirm modal -->
<div id="confirm-modal" class="modal-backdrop hidden" onclick="closeConfirmOnBackdrop(event)">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h2 id="confirm-title">Confirm</h2>
      <button class="modal-close" onclick="closeConfirm()">✕</button>
    </div>
    <p id="confirm-message" class="confirm-msg"></p>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeConfirm()">Cancel</button>
      <button class="btn-danger" id="confirm-ok-btn" onclick="confirmOk()">Confirm</button>
    </div>
  </div>
</div>

<!-- Level-up overlay -->
<div id="levelup-overlay" class="levelup-overlay hidden">
  <div class="levelup-card">
    <div class="levelup-sparks" id="levelup-sparks"></div>
    <div class="levelup-icon">⚡</div>
    <div class="levelup-label">LEVEL UP!</div>
    <div class="levelup-level" id="levelup-level"></div>
    <div class="levelup-title" id="levelup-title"></div>
    <button class="btn-primary" onclick="closeLevelUp()">Keep Going!</button>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script src="/static/app.js"></script>
</body>
</html>
